[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recallaccelerator-mcp"
version = "0.3.0"
description = "RecallAccelerator MCP server + racred credential broker CLI for Claude Code, Cursor, Codex, and other AI coding agents."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
recallaccelerator-mcp = "recallaccelerator_mcp.server:main"
racred = "recallaccelerator_mcp.racred:main"

[tool.setuptools.packages.find]
where = ["src"]
